name: Versionado automatico

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: automatic-release-tag-main
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio e historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener version aprobada
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./frontend/package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La version '$version' no cumple el formato A.B.C." >&2
            exit 1
          fi

          release_tag="release-${version}"
          existing_commit=$(git rev-list -n 1 "$release_tag" 2>/dev/null || true)
          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "El tag $release_tag ya pertenece a otro commit. Actualice frontend/package.json." >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$existing_commit" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Etiquetar commit publicado
        if: steps.version.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject=$(git log -1 --pretty=%s "$GITHUB_SHA")
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$RELEASE_TAG - $subject"
          git push origin "$RELEASE_TAG"
